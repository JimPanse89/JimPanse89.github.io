<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">

<title>Joyce Wall Messenger</title>

<style>
:root{
  --bg:#0b0b12;
  --panel:rgba(255,255,255,.06);
  --text:#eaeaf5;
  --muted:#9fa3c7;
  --red:#ff1b2d;
  --ok:#21d07a;
  --err:#ff4b57;
}

body{
  margin:0;
  font-family:system-ui;
  background:
    radial-gradient(circle at 20% 0%, rgba(255,27,45,.25), transparent 60%),
    #0b0b12;
  color:var(--text);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
}

/* ---------------- CARD ---------------- */

.card{
  width:min(820px,100%);
  background:var(--panel);
  padding:28px;
  border-radius:18px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}

/* Stranger Things Title */
h1{
  font-family:'Creepster', cursive;
  text-align:center;
  font-size:56px;
  margin:0 0 22px 0;
  color:var(--red);
  text-shadow:
    0 0 8px rgba(255,27,45,.9),
    0 0 24px rgba(255,27,45,.7),
    0 0 48px rgba(255,27,45,.4);
}

/* ---------------- STRAND ---------------- */

.strand-wrap{
  background:#111;
  padding:14px;
  border-radius:14px;
  margin-bottom:18px;
}

.strand{
  display:grid;
  grid-template-columns:repeat(13,1fr);
  gap:8px;
}

.bulb{
  aspect-ratio:1/1;
  border-radius:50%;
  background:#222;
  border:1px solid #333;
  transition:.15s;
}

.bulb.on{
  background:white;
  box-shadow:
    0 0 10px white,
    0 0 25px white,
    0 0 40px rgba(255,255,255,.5);
}

/* ---------------- INPUTS ---------------- */

input{
  width:100%;
  padding:14px;
  font-size:18px;
  border-radius:12px;
  border:1px solid #333;
  background:#111;
  color:white;
  margin-bottom:10px;
}

button{
  width:100%;
  padding:14px;
  font-weight:bold;
  border:none;
  border-radius:12px;
  background:var(--red);
  color:white;
  cursor:pointer;
  margin-bottom:10px;
}

button:disabled{opacity:.5}

.status{
  font-size:13px;
  margin-bottom:14px;
  color:var(--muted);
}
.ok{color:var(--ok)}
.err{color:var(--err)}

/* ---------------- HISTORY ---------------- */

.history{
  background:#111;
  border-radius:12px;
  padding:10px;
  font-size:13px;
  max-height:150px;
  overflow:auto;
}

.msg{padding:3px 0;border-bottom:1px solid #222}

/* ---------------- INTRO ---------------- */

.intro{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#000;
  transition:opacity .7s;
}

.intro.hidden{
  opacity:0;
  pointer-events:none;
}

.intro-title{
  font-family:'Creepster';
  font-size:90px;
  color:#ff1b2d;
  text-shadow:
    0 0 12px rgba(255,27,45,.9),
    0 0 30px rgba(255,27,45,.6),
    0 0 60px rgba(255,27,45,.4);
  animation:flicker 2s infinite;
}

@keyframes flicker{
  0%,100%{opacity:1}
  50%{opacity:.85}
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro" class="intro">
  <div class="intro-title">JOYCE WALL</div>
</div>

<div class="card">

<h1>Joyce Wall</h1>

<div class="strand-wrap">
  <div class="strand" id="strand"></div>
</div>

<input id="msg" placeholder="HELLO WORLD" maxlength="26"/>
<button id="send">Send Message</button>

<div id="status" class="status">Bereit…</div>

<div class="history" id="history"></div>

</div>

<script>
/* CONFIG */
const WEBHOOK_URL="https://eoipntgq6ax4882.m.pipedream.net/";
const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const MAX_LEN=26;

/* INTRO */
window.addEventListener("load",()=>{
  setTimeout(()=>document.getElementById("intro").classList.add("hidden"),1800);
});

/* ELEMENTS */
const strand=document.getElementById("strand");
const msg=document.getElementById("msg");
const btn=document.getElementById("send");
const status=document.getElementById("status");
const historyBox=document.getElementById("history");

const bulbs={},history=[];

/* BUILD BULBS */
letters.forEach(l=>{
  const b=document.createElement("div");
  b.className="bulb";
  strand.appendChild(b);
  bulbs[l]=b;
});

/* HELPERS */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function clean(t){
  return (t||"")
    .toUpperCase()
    .replace(/[Ä]/g,"A")
    .replace(/[Ö]/g,"O")
    .replace(/[Ü]/g,"U")
    .replace(/[ß]/g,"SS")
    .replace(/[^A-Z ]/g,"")
    .slice(0,MAX_LEN);
}

function allOff(){Object.values(bulbs).forEach(b=>b.classList.remove("on"))}
function on(l){bulbs[l]?.classList.add("on")}
function off(l){bulbs[l]?.classList.remove("on")}

/* ANIMATION (wie ESP32) */
async function animate(text){
  allOff();

  for(let i=0;i<2;i++){
    Object.values(bulbs).forEach(b=>b.classList.add("on"));
    await sleep(200);
    allOff();
    await sleep(200);
  }

  for(const c of text){
    if(c===" "){await sleep(750);continue;}
    on(c);
    await sleep(500);
    off(c);
    await sleep(250);
  }

  for(let i=0;i<4;i++){
    Object.values(bulbs).forEach(b=>b.classList.add("on"));
    await sleep(100);
    allOff();
    await sleep(100);
  }
}

/* HISTORY */
function addHistory(t){
  history.unshift(t);
  if(history.length>10)history.pop();
  historyBox.innerHTML=history.map(x=>`<div class="msg">• ${x}</div>`).join("");
}

/* LIVE FILTER */
msg.addEventListener("input",()=>{
  msg.value=clean(msg.value);
  status.textContent=`${msg.value.length}/${MAX_LEN} Zeichen`;
});

/* SEND */
async function send(){
  const text=clean(msg.value);
  if(!text)return;

  btn.disabled=true;
  status.textContent="Sende…";

  animate(text);

  try{
    await fetch(WEBHOOK_URL,{
      method:"POST",
      headers:{"content-type":"application/json"},
      body:JSON.stringify({text})
    });

    status.textContent="OK ✅";
    status.className="status ok";
    addHistory(text);
  }catch{
    status.textContent="Fehler ❌";
    status.className="status err";
  }

  btn.disabled=false;
  msg.value="";
}

btn.onclick=send;
msg.addEventListener("keydown",e=>{if(e.key==="Enter")send();});
</script>

</body>
</html>
