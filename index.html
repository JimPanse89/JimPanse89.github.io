<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
<title>Joyce Wall Messenger</title>

<style>
:root{
  --red:#ff1b2d;
  --bg:#0b0b12;
  --panel:rgba(255,255,255,.06);
  --muted:#9fa3c7;
}

body{
  margin:0;
  font-family:system-ui;
  background:
    radial-gradient(circle at 20% 0%, rgba(255,27,45,.25), transparent 60%),
    #0b0b12;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  color:white;
  padding:20px;
}

.card{
  width:min(980px,100%);
  background:var(--panel);
  padding:28px;
  border-radius:18px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}

h1{
  font-family:'Creepster';
  text-align:center;
  font-size:62px;
  margin:0 0 18px;
  color:var(--red);
  text-shadow:
    0 0 10px rgba(255,27,45,.9),
    0 0 35px rgba(255,27,45,.6),
    0 0 70px rgba(255,27,45,.4);
}

/* ---------------- STRAND ---------------- */

.strand-wrap{
  position:relative;
  padding:18px 10px 10px;
  margin: 6px 0 18px;
  border-radius:14px;
  background:#111;
  overflow:hidden;
  border: 1px solid rgba(255,255,255,0.06);
}

/* Kabel Layer */
.cable{
  position:absolute;
  left:-20px;
  right:-20px;
  height:90px;
  pointer-events:none;
  opacity:.95;
}
.cable svg{ width:100%; height:100%; display:block; }
.cable path{
  stroke:#2b2b2b;
  stroke-width:5;
  fill:none;
  stroke-linecap:round;
}
.cable path.shadow{
  stroke:#090909;
  stroke-width:10;
  opacity:.55;
  filter: blur(0.2px);
}

/* Kabel: Reihe 1 (oben) */
.cable.top{ top:14px; }
/* Kabel: Reihe 2 (unten) */
.cable.bottom{ top:112px; }

/* Verbindungskabel links zwischen den Reihen */
.bridge{
  position:absolute;
  left:14px;
  top:52px;
  width:10px;
  height:92px;
  pointer-events:none;
  opacity:.95;
}
.bridge:before{
  content:"";
  position:absolute;
  left:3px;
  top:0;
  width:5px;
  height:100%;
  background:#2b2b2b;
  border-radius:6px;
  box-shadow: 0 0 0 3px rgba(9,9,9,0.45);
}

/* Grid für 26 Lampen (2 Reihen à 13) */
.strand{
  position:relative;
  display:grid;
  grid-template-columns:repeat(13, 1fr);
  gap: 12px 10px;
  padding-top: 34px; /* Platz für oberes Kabel */
  padding-bottom: 10px;
}

/* Lampen-Container */
.bulb{
  position:relative;
  width:100%;
  height:78px;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  transform: translateY(var(--drop, 0px));
}

/* Draht nach oben zur Leitung */
.bulb .wire{
  position:absolute;
  top:-18px;
  width:2px;
  height:18px;
  background:#2b2b2b;
  opacity:.95;
}

/* Sockel */
.bulb .base{
  width:14px;
  height:10px;
  background:#4a4a4a;
  border-radius:2px;
  margin-top:-6px;
  z-index:3;
  box-shadow:
    inset 0 -2px 0 rgba(0,0,0,.45),
    0 0 0 1px rgba(0,0,0,.35);
}

/* Konische Weihnachtsbirne */
.bulb .glass{
  position:absolute;
  top:10px;
  width:26px;
  height:40px;

  /* Konisch: oben schmaler, unten breiter */
  clip-path: polygon(
    38% 0%,
    62% 0%,
    78% 18%,
    88% 46%,
    80% 78%,
    60% 100%,
    40% 100%,
    20% 78%,
    12% 46%,
    22% 18%
  );

  background: rgba(255,255,255,0.10);
  border: 1px solid rgba(255,255,255,0.14);
  box-shadow:
    inset 0 -12px 16px rgba(0,0,0,.58),
    inset 0 10px 12px rgba(255,255,255,.08);
  transition: 160ms;
}

/* Glanz */
.bulb .glass:before{
  content:"";
  position:absolute;
  left:30%;
  top:14%;
  width:20%;
  height:45%;
  border-radius:999px;
  background: rgba(255,255,255,0.20);
  transform: rotate(-12deg);
  filter: blur(0.2px);
}

/* AUS: leicht farbiger Kunststoff */
.bulb[data-color="red"]   .glass{ background: rgba(255, 70, 70, 0.16); }
.bulb[data-color="green"] .glass{ background: rgba( 70,255,160, 0.14); }
.bulb[data-color="blue"]  .glass{ background: rgba( 90,185,255, 0.14); }
.bulb[data-color="yellow"].glass{ background: rgba(255,230, 95, 0.14); }

/* Farbe pro Lampe */
.bulb[data-color="red"]    { --glow: rgb(255, 55, 55); }
.bulb[data-color="green"]  { --glow: rgb( 60,255,140); }
.bulb[data-color="blue"]   { --glow: rgb( 80,170,255); }
.bulb[data-color="yellow"] { --glow: rgb(255,220, 80); }

/* AN: kräftig leuchtend in Lampenfarbe */
.bulb.on .glass{
  border-color: rgba(255,255,255,0.22);
  box-shadow:
    0 0 10px var(--glow),
    0 0 26px var(--glow),
    0 0 62px rgba(255,255,255,0.10),
    inset 0 -10px 16px rgba(0,0,0,.36),
    inset 0 10px 12px rgba(255,255,255,.10);
}

.bulb.on[data-color="red"]    .glass{ background: rgba(255, 75, 75, 0.92); }
.bulb.on[data-color="green"]  .glass{ background: rgba( 75,255,155, 0.88); }
.bulb.on[data-color="blue"]   .glass{ background: rgba( 95,190,255, 0.88); }
.bulb.on[data-color="yellow"] .glass{ background: rgba(255,232,105, 0.90); }

/* ---------- INPUTS ---------- */

input{
  width:100%;
  padding:14px;
  background:#0f0f0f;
  border:1px solid #333;
  border-radius:12px;
  color:white;
  font-size:18px;
  margin-bottom:10px;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:var(--red);
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{opacity:.5}

.status{
  font-size:13px;
  margin:10px 0;
  color:var(--muted);
}

.history{
  margin-top:14px;
  font-size:13px;
  max-height:160px;
  overflow:auto;
  background:#0f0f0f;
  border-radius:12px;
  padding:10px;
  border: 1px solid rgba(255,255,255,0.06);
}

.msg{
  padding:4px 0;
  border-bottom:1px solid #222;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
}

/* ---------- INTRO ---------- */
.intro{
  position:fixed;
  inset:0;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:999;
  transition:opacity .7s;
}
.intro.hidden{opacity:0;pointer-events:none}
.intro-title{
  font-family:'Creepster';
  font-size: clamp(56px, 9vw, 92px);
  color:var(--red);
  text-shadow:0 0 30px var(--red);
}
</style>
</head>

<body>

<div id="intro" class="intro">
  <div class="intro-title">JOYCE WALL</div>
</div>

<div class="card">
  <h1>Joyce Wall</h1>

  <div class="strand-wrap">
    <!-- Kabel oben (Reihe 1) -->
    <div class="cable top" aria-hidden="true">
      <svg viewBox="0 0 1000 120" preserveAspectRatio="none">
        <path class="shadow" d="M0,40 C120,95 240,10 360,58 C480,105 620,20 740,64 C860,98 940,30 1000,62"></path>
        <path d="M0,40 C120,95 240,10 360,58 C480,105 620,20 740,64 C860,98 940,30 1000,62"></path>
      </svg>
    </div>

    <!-- Verbindung links runter -->
    <div class="bridge" aria-hidden="true"></div>

    <!-- Kabel unten (Reihe 2) -->
    <div class="cable bottom" aria-hidden="true">
      <svg viewBox="0 0 1000 120" preserveAspectRatio="none">
        <path class="shadow" d="M0,52 C140,110 260,18 380,70 C520,122 650,28 770,74 C900,112 960,40 1000,74"></path>
        <path d="M0,52 C140,110 260,18 380,70 C520,122 650,28 770,74 C900,112 960,40 1000,74"></path>
      </svg>
    </div>

    <div class="strand" id="strand"></div>
  </div>

  <input id="msg" placeholder="HELLO WORLD" maxlength="26" />
  <button id="send">Send Message</button>

  <div id="status" class="status">Bereit…</div>
  <div id="history" class="history"></div>
</div>

<script>
/* ---------------- CONFIG ---------------- */
const WEBHOOK_URL = "https://eoipntgq6ax4882.m.pipedream.net/";
const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const MAX_LEN = 26;
const colorCycle = ["red","green","blue","yellow"];
/* ---------------------------------------- */

const intro = document.getElementById("intro");
window.addEventListener("load", () => setTimeout(() => intro.classList.add("hidden"), 1800));

const strand = document.getElementById("strand");
const msg = document.getElementById("msg");
const btn = document.getElementById("send");
const status = document.getElementById("status");
const historyBox = document.getElementById("history");

const bulbs = {};
const history = [];

/* Build bulbs with sag + wire length matching sag */
letters.forEach((l, i) => {
  const b = document.createElement("div");
  b.className = "bulb";

  // Farbe
  b.dataset.color = colorCycle[i % colorCycle.length];

  // Durchhang pro Reihe (2 Reihen à 13)
  const row = Math.floor(i / 13);     // 0/1
  const colIdx = i % 13;              // 0..12
  const t = colIdx / 12;              // 0..1
  const sag = Math.sin(t * Math.PI) * 12; // 0..12..0

  // zweite Reihe etwas tiefer + minimal "chaos"
  const baseOffset = row === 0 ? 0 : 10;
  const jitter = ((i * 17) % 5) - 2; // -2..+2 deterministic
  const drop = sag + baseOffset + jitter;

  b.style.setProperty("--drop", `${drop}px`);

  const wire = document.createElement("div");
  wire.className = "wire";
  // Drahtlänge anpassen (damit’s wirklich am Kabel hängt)
  wire.style.height = `${18 + drop}px`;
  wire.style.top = `${- (18 + drop)}px`;

  const base = document.createElement("div");
  base.className = "base";

  const glass = document.createElement("div");
  glass.className = "glass";

  b.appendChild(wire);
  b.appendChild(base);
  b.appendChild(glass);

  strand.appendChild(b);
  bulbs[l] = b;
});

const sleep = (ms) => new Promise(r => setTimeout(r, ms));

function clean(t){
  return (t||"")
    .toUpperCase()
    .replace(/Ä/g,"A").replace(/Ö/g,"O").replace(/Ü/g,"U").replace(/ß/g,"SS")
    .replace(/[^A-Z ]/g,"")
    .trimStart()
    .slice(0, MAX_LEN);
}

function allOff(){ Object.values(bulbs).forEach(b => b.classList.remove("on")); }
function allOn(){ Object.values(bulbs).forEach(b => b.classList.add("on")); }
function on(l){ bulbs[l]?.classList.add("on"); }
function off(l){ bulbs[l]?.classList.remove("on"); }

/* ESP gleiche Animation */
async function animate(text){
  allOff();

  for(let i=0;i<2;i++){
    allOn(); await sleep(200);
    allOff(); await sleep(200);
  }

  for(const c of text){
    if(c === " "){ await sleep(750); continue; }
    on(c); await sleep(500);
    off(c); await sleep(250);
  }

  await sleep(250);
  for(let i=0;i<4;i++){
    allOn(); await sleep(100);
    allOff(); await sleep(100);
  }
}

function addHistory(t){
  history.unshift(t);
  if(history.length > 10) history.pop();
  historyBox.innerHTML = history.map(x => `<div class="msg">• ${x}</div>`).join("");
}

msg.addEventListener("input", () => {
  msg.value = clean(msg.value);
  status.textContent = `${msg.value.length}/${MAX_LEN} Zeichen (nur A–Z & Leerzeichen)`;
});

async function send(){
  const text = clean(msg.value);
  if(!text){
    status.textContent = "Bitte Text eingeben.";
    return;
  }

  btn.disabled = true;
  status.textContent = "Sende…";

  animate(text).catch(()=>{});

  try{
    const r = await fetch(WEBHOOK_URL,{
      method:"POST",
      headers:{"content-type":"application/json"},
      body: JSON.stringify({ text })
    });

    if(r.ok){
      status.textContent = "OK ✅";
      addHistory(text);
      msg.value = "";
      msg.focus();
    } else {
      status.textContent = "Fehler ❌";
    }
  } catch(e){
    status.textContent = "Netzwerkfehler ❌";
  } finally {
    btn.disabled = false;
  }
}

btn.addEventListener("click", send);
msg.addEventListener("keydown", e => { if(e.key === "Enter") send(); });
</script>

</body>
</html>
