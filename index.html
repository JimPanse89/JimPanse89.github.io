<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Joyce Wall Messenger</title>
  <style>
    :root{
      --bg:#0b0b12;
      --panel: rgba(255,255,255,0.06);
      --text:#eaeaf5;
      --muted:#b9b9d6;
      --red:#ff1b2d;
      --ok:#21d07a;
      --err:#ff4b57;
    }

    body{
      margin:0;
      min-height:100vh;
      font-family: system-ui, sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 20% 0%, rgba(255,27,45,.2), transparent 60%),
        #0b0b12;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .card{
      width:min(720px,100%);
      background:var(--panel);
      padding:28px;
      border-radius:18px;
      box-shadow:0 20px 60px rgba(0,0,0,.6);
    }

    h1{
      margin:0 0 18px 0;
      text-transform:uppercase;
      letter-spacing:.08em;
      color:#fff;
      text-shadow:0 0 14px rgba(255,27,45,.5);
    }

    input{
      width:100%;
      padding:14px;
      font-size:18px;
      border-radius:12px;
      border:1px solid #333;
      background:#111;
      color:#fff;
      margin-bottom:12px;
    }

    button{
      width:100%;
      padding:14px;
      font-size:16px;
      font-weight:bold;
      border:none;
      border-radius:12px;
      background:var(--red);
      color:#fff;
      cursor:pointer;
    }

    button:disabled{
      opacity:.5;
    }

    .status{
      margin-top:14px;
      font-size:13px;
      color:var(--muted);
      white-space:pre-wrap;
    }

    .ok{ color:var(--ok); }
    .err{ color:var(--err); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Stranger Things Wall</h1>
<input id="msg" placeholder="HELLO WORLD" maxlength="60"/>
<button id="send">Send Message</button>

<div id="status" class="status">Bereit…</div>  </div>
  <script>
    // ✅ DEIN WEBHOOK IST HIER SCHON EINGEBAUT
    const WEBHOOK_URL = "https://eoipntgq6ax4882.m.pipedream.net/";

    const msg = document.getElementById("msg");
    const btn = document.getElementById("send");
    const status = document.getElementById("status");

    function sanitize(t){
      return (t||"")
        .toUpperCase()
        .replace(/[^A-Z0-9 .,!?]/g,"")
        .trim()
        .slice(0,60);
    }

    async function send(){
      const text = sanitize(msg.value);
      if(!text){
        status.textContent="Bitte Text eingeben.";
        return;
      }

      btn.disabled=true;
      status.textContent="Sende...";

      try{
        const r = await fetch(WEBHOOK_URL,{
          method:"POST",
          headers:{ "content-type":"application/json" },
          body: JSON.stringify({ text })
        });

        if(r.ok){
          status.textContent="OK ✅ " + text;
          status.className="status ok";
        }else{
          status.textContent="Fehler ❌";
          status.className="status err";
        }
      }
      catch(e){
        status.textContent="Netzwerkfehler ❌";
        status.className="status err";
      }

      btn.disabled=false;
      msg.select();
    }

    btn.onclick = send;
    msg.addEventListener("keydown", e=>{
      if(e.key==="Enter") send();
    });
  </script>
</body>
</html>
:::
