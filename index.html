<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Stranger Things ähnliche Schrift -->
  <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">

  <title>Joyce Wall Messenger</title>

  <style>
    :root{
      --bg:#0b0b12;
      --panel: rgba(255,255,255,0.06);
      --text:#eaeaf5;
      --muted:#9fa3c7;
      --red:#ff1b2d;
      --ok:#21d07a;
      --err:#ff4b57;
    }

    body{
      margin:0;
      min-height:100vh;
      font-family: system-ui, sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 20% 0%, rgba(255,27,45,.25), transparent 60%),
        #0b0b12;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .card{
      width:min(760px,100%);
      background:var(--panel);
      padding:28px;
      border-radius:18px;
      box-shadow:0 20px 60px rgba(0,0,0,.6);
      backdrop-filter: blur(6px);
    }

    /* 🔥 Stranger Things Style */
    h1{
      font-family: 'Creepster', cursive;
      font-size:48px;
      letter-spacing:2px;
      margin:0 0 24px 0;
      text-align:center;
      color:var(--red);
      text-shadow:
        0 0 8px rgba(255,27,45,.9),
        0 0 24px rgba(255,27,45,.7),
        0 0 48px rgba(255,27,45,.4);
    }

    input{
      width:100%;
      padding:14px;
      font-size:18px;
      border-radius:12px;
      border:1px solid #333;
      background:#111;
      color:#fff;
      margin-bottom:12px;
    }

    button{
      width:100%;
      padding:14px;
      font-size:16px;
      font-weight:bold;
      border:none;
      border-radius:12px;
      background:var(--red);
      color:#fff;
      cursor:pointer;
      margin-bottom:14px;
    }

    button:disabled{ opacity:.5; }

    .status{
      font-size:13px;
      margin-bottom:16px;
      color:var(--muted);
    }

    .ok{ color:var(--ok); }
    .err{ color:var(--err); }

    /* History */
    .history{
      background:#111;
      border-radius:12px;
      padding:12px;
      max-height:180px;
      overflow-y:auto;
      font-size:13px;
    }

    .history-title{
      font-weight:bold;
      margin-bottom:8px;
      color:var(--muted);
    }

    .msg{
      padding:4px 0;
      border-bottom:1px solid rgba(255,255,255,.05);
      font-family: monospace;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Joyce Wall</h1>

    <input id="msg" placeholder="HELLO WORLD" maxlength="60"/>
    <button id="send">Send Message</button>

    <div id="status" class="status">Bereit…</div>

    <div class="history">
      <div class="history-title">Letzte Nachrichten</div>
      <div id="historyList"></div>
    </div>
  </div>

  <script>
    const WEBHOOK_URL = "https://eoipntgq6ax4882.m.pipedream.net/";

    const msg = document.getElementById("msg");
    const btn = document.getElementById("send");
    const status = document.getElementById("status");
    const historyList = document.getElementById("historyList");

    const history = [];

    function sanitize(t){
      return (t||"")
        .toUpperCase()
        .replace(/[^A-Z0-9 .,!?]/g,"")
        .trim()
        .slice(0,60);
    }

    function addHistory(text){
      history.unshift(text);
      if(history.length > 10) history.pop();

      historyList.innerHTML = history
        .map(t => `<div class="msg">• ${t}</div>`)
        .join("");
    }

    async function send(){
      const text = sanitize(msg.value);
      if(!text) return;

      btn.disabled=true;
      status.textContent="Sende...";

      try{
        const r = await fetch(WEBHOOK_URL,{
          method:"POST",
          headers:{ "content-type":"application/json" },
          body: JSON.stringify({ text })
        });

        if(r.ok){
          status.textContent="OK ✅";
          status.className="status ok";
          addHistory(text);
        } else {
          status.textContent="Fehler ❌";
          status.className="status err";
        }
      }
      catch{
        status.textContent="Netzwerkfehler ❌";
        status.className="status err";
      }

      btn.disabled=false;
      msg.value="";
      msg.focus();
    }

    btn.onclick = send;
    msg.addEventListener("keydown", e=>{
      if(e.key==="Enter") send();
    });
  </script>
</body>
</html>
