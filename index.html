<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stranger Things Wall</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
    h1 { margin-bottom: 8px; }
    .hint { color: #555; margin-top: 0; }
    input, button { font-size: 18px; padding: 12px; width: 100%; box-sizing: border-box; }
    button { margin-top: 10px; cursor: pointer; }
    pre { margin-top: 14px; background: #f6f6f6; padding: 12px; border-radius: 8px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Stranger Things – Nachricht senden</h1>
  <p class="hint">Erlaubt: A–Z, 0–9, Leerzeichen, . , ! ? (max 60 Zeichen)</p>

  <input id="msg" placeholder="HELLO WORLD" maxlength="60" />
  <button id="send">Senden</button>

  <pre id="log"></pre>

  <script>
    const WEBHOOK_URL = "HIER_DEINE_PIPEDREAM_WEBHOOK_URL_EINFÜGEN";

    const logEl = document.getElementById("log");
    const log = (s) => logEl.textContent += s + "\n";

    function sanitize(s){
      return (s || "")
        .toUpperCase()
        .replace(/[^A-Z0-9 .,!?]/g, "")
        .trim()
        .slice(0, 60);
    }

    document.getElementById("send").onclick = async () => {
      const text = sanitize(document.getElementById("msg").value);
      if (!text) return log("Bitte Text eingeben.");

      log("Sende…");
      try {
        const r = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ text })
        });

        const data = await r.json().catch(() => ({}));
        if (r.ok) log("OK ✅ " + (data.text || text));
        else log("Error ❌ " + JSON.stringify(data));
      } catch (e) {
        log("Network error ❌ " + e.message);
      }
    };
  </script>
</body>
</html>
