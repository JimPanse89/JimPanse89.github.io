<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<title>Bennos Wall Messenger</title>

<style>
:root{
  --red:#ff1b2d;
  --muted:#c7c9de;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  min-height:100vh;
  color:white;
  padding:20px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#05050a;
  overflow-x:hidden;
}

/* ===================== Poster Background (NO silhouettes) ===================== */
.poster-bg{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
}
.poster-bg .top{
  position:absolute; inset:0 0 50% 0;
  background:
    radial-gradient(circle at 20% 10%, rgba(255,27,45,.40), transparent 60%),
    radial-gradient(circle at 80% 20%, rgba(255,27,45,.26), transparent 60%),
    linear-gradient(to bottom, #09060a 0%, #2a0710 45%, #520813 100%);
}
.poster-bg .bottom{
  position:absolute; inset:50% 0 0 0;
  background:
    radial-gradient(circle at 65% 20%, rgba(90,185,255,.22), transparent 55%),
    radial-gradient(circle at 25% 30%, rgba(90,185,255,.16), transparent 60%),
    linear-gradient(to bottom, #09060a 0%, #061021 40%, #031225 100%);
}
.poster-bg .rift{
  position:absolute;
  left:-10vw; right:-10vw;
  top:48%;
  height:18%;
  background:
    radial-gradient(circle at 50% 50%, rgba(0,0,0,0.85), rgba(0,0,0,0.0) 70%),
    linear-gradient(to bottom, rgba(0,0,0,0.0), rgba(0,0,0,0.86), rgba(0,0,0,0.0));
  filter: blur(1.5px);
  opacity: .98;
}
.poster-bg::after{
  content:"";
  position:absolute; inset:0;
  background:
    radial-gradient(circle at 50% 50%, rgba(0,0,0,0.0) 55%, rgba(0,0,0,0.65) 100%);
  mix-blend-mode:multiply;
}

.poster-grain{
  position:fixed; inset:0;
  z-index:1;
  pointer-events:none;
  opacity:.18;
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0px, rgba(255,255,255,.05) 1px, rgba(0,0,0,0) 2px, rgba(0,0,0,0) 4px);
  filter: blur(.2px);
}

/* Subtle global flicker */
body::before{
  content:"";
  position:fixed; inset:0;
  z-index:2;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 22%, rgba(255,27,45,0.10), transparent 55%),
    radial-gradient(circle at 55% 78%, rgba(90,185,255,0.09), transparent 60%);
  opacity:.55;
  animation: udFlicker 6.2s infinite steps(1,end);
}
@keyframes udFlicker{
  0%{opacity:.46;filter:brightness(1)}
  6%{opacity:.62;filter:brightness(1.03)}
  9%{opacity:.38;filter:brightness(.99)}
  14%{opacity:.64;filter:brightness(1.04)}
  18%{opacity:.44;filter:brightness(1)}
  43%{opacity:.58;filter:brightness(1.02)}
  46%{opacity:.36;filter:brightness(.99)}
  63%{opacity:.66;filter:brightness(1.04)}
  79%{opacity:.48;filter:brightness(1)}
  100%{opacity:.46;filter:brightness(1)}
}

/* ===================== Intro ===================== */
.intro{
  position:fixed; inset:0;
  z-index:9999;
  display:flex; align-items:center; justify-content:center;
  background:#000;
  animation: introFade 2.0s ease forwards;
}
.intro-title{
  font-family:'Cinzel', serif;
  font-weight:700;
  text-transform:uppercase;
  font-size: clamp(52px, 9.5vw, 92px);
  letter-spacing: .14em;
  color: var(--red);
  -webkit-text-stroke: 1.1px rgba(0,0,0,0.65);
  text-shadow:
    0 0 6px rgba(255,27,45,.85),
    0 0 18px rgba(255,27,45,.55),
    0 10px 30px rgba(0,0,0,.65);
  animation: introGlow 1.8s ease forwards;
}
@keyframes introGlow{
  0%{ filter: blur(6px); opacity:.0; transform:scale(1.02); }
  22%{ filter: blur(1px); opacity:1; transform:scale(1); }
  100%{ filter: blur(0px); opacity:1; }
}
@keyframes introFade{
  0%,70%{opacity:1}
  100%{opacity:0; pointer-events:none; visibility:hidden;}
}

/* ===================== Ash Particles ===================== */
#particles{
  position:fixed; inset:0;
  width:100%; height:100%;
  z-index:3;
  pointer-events:none;
  opacity:.86;
  mix-blend-mode:screen;
}

/* ===================== Card ===================== */
.card{
  position:relative;
  z-index:4;
  width:min(980px,100%);
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.09);
  border-radius:18px;
  padding:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.65);
  backdrop-filter: blur(7px);
  -webkit-backdrop-filter: blur(7px);
}

.title-plate{
  position:relative;
  border-radius:16px;
  padding:14px 10px 10px;
  margin-bottom:14px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.58), rgba(0,0,0,0.20));
  border: 1px solid rgba(255,255,255,0.06);
  overflow:hidden;
}
.title-plate::after{
  content:"";
  position:absolute; inset:-40px;
  background: radial-gradient(circle at 50% 30%, rgba(255,27,45,0.25), transparent 60%);
  filter: blur(18px);
  opacity: .9;
  pointer-events:none;
}

h1{
  position:relative;
  z-index:1;
  font-family:'Cinzel', serif;
  font-weight:700;
  text-transform:uppercase;
  text-align:center;
  font-size: clamp(30px, 4.6vw, 48px);
  margin:0;
  color:var(--red);
  letter-spacing: .18em;
  -webkit-text-stroke: 1.2px rgba(0,0,0,0.70);
  text-shadow:
    0 0 5px rgba(255,27,45,.85),
    0 0 14px rgba(255,27,45,.55),
    0 2px 0 rgba(0,0,0,0.65);
}
h1::before, h1::after{
  content:"";
  display:block;
  height:2px;
  margin:10px auto;
  width:min(520px, 86%);
  background: linear-gradient(to right, transparent, rgba(255,27,45,.95), transparent);
  filter: drop-shadow(0 0 6px rgba(255,27,45,.55));
  opacity:.9;
}
h1::before{ margin-top:2px; }
h1::after{ margin-bottom:2px; }

.subtitle{
  position:relative;
  z-index:1;
  text-align:center;
  margin-top:6px;
  font-size:12px;
  letter-spacing: .18em;
  color: rgba(255,255,255,0.70);
  text-transform: uppercase;
}

/* Strand box */
.strand-wrap{
  position:relative;
  margin: 8px 0 14px;
  border-radius:16px;
  background: rgba(0,0,0,.45);
  border: 1px solid rgba(255,255,255,.07);
  overflow:hidden;
  padding: 18px 10px 14px;
}

/* Only horizontal cables */
.cable{
  position:absolute;
  left:-20px; right:-20px;
  height:90px;
  pointer-events:none;
  opacity:.95;
}
.cable svg{ width:100%; height:100%; display:block; }
.cable path{
  stroke:#2b2b2b;
  stroke-width:5.5;
  fill:none;
  stroke-linecap:round;
}
.cable path.shadow{
  stroke:#090909;
  stroke-width:11;
  opacity:.55;
  filter: blur(0.25px);
}
.cable.top{ top:12px; }
.cable.bottom{ top:108px; }

/* Left bridge cable */
.bridge{
  position:absolute;
  left:18px;
  top:50px;
  width:10px;
  height:92px;
  pointer-events:none;
  opacity:.95;
}
.bridge:before{
  content:"";
  position:absolute;
  left:3px; top:0;
  width:5px; height:100%;
  background:#2b2b2b;
  border-radius:6px;
  box-shadow: 0 0 0 3px rgba(9,9,9,0.45);
}

/* Bulb grid */
.strand{
  position:relative;
  display:grid;
  grid-template-columns:repeat(13, minmax(0,1fr));
  gap: 14px 10px;
  padding-top: 34px;
  padding-bottom: 10px;
}

@media (max-width: 520px){
  body{ padding:12px; }
  .card{ padding:16px; }
  .title-plate{ padding:12px 10px 8px; }
  .strand-wrap{ padding:16px 10px 12px; }
  .strand{ gap: 12px 8px; }
  h1{ letter-spacing:.14em; }
}

/* Bulb container */
.bulb{
  position:relative;
  height:96px;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  transform: translateY(var(--drop, 0px));
}

/* Socket */
.bulb .socket{
  position:absolute;
  top:-6px;
  width:24px;
  height:15px;
  background:#0d0d0d;
  border-radius:5px 5px 8px 8px;
  box-shadow: inset 0 -2px 0 rgba(255,255,255,0.06), 0 1px 0 rgba(0,0,0,0.85);
  z-index:5;
}
.bulb .socket:before{
  content:"";
  position:absolute;
  top:-6px; left:50%;
  transform:translateX(-50%);
  width:16px; height:8px;
  background:#0b0b0b;
  border-radius: 7px 7px 4px 4px;
  box-shadow: inset 0 -1px 0 rgba(255,255,255,0.05);
}

/* Colors */
.bulb[data-color="red"]    { --glow: rgb(255, 55, 55); }
.bulb[data-color="green"]  { --glow: rgb( 60,255,140); }
.bulb[data-color="blue"]   { --glow: rgb( 80,170,255); }
.bulb[data-color="yellow"] { --glow: rgb(255,220, 80); }

/* Glow */
.bulb .glow{
  position:absolute;
  top:-2px;
  width:58px;
  height:88px;
  border-radius:999px;
  background: radial-gradient(circle at 50% 62%, var(--glow) 0%, transparent 66%);
  opacity: var(--idleG, 0.18);  /* default idle */
  filter: blur(14px);
  pointer-events:none;
  transition: opacity 120ms linear;
  z-index:1;
}

/* Glass */
.bulb .glass{
  position:absolute;
  top:8px;
  width:34px;
  height:64px;
  border-radius: 10px 10px 18px 18px / 18px 18px 40px 40px;
  background:
    radial-gradient(ellipse at 50% 16%, rgba(0,0,0,0.28) 0%, rgba(0,0,0,0.00) 52%),
    linear-gradient(to bottom, rgba(255,255,255,0.10) 0%, rgba(0,0,0,0.10) 55%, rgba(0,0,0,0.24) 100%);
  border:1px solid rgba(255,255,255,0.16);
  box-shadow: inset 0 -22px 26px rgba(0,0,0,.52), inset 0 12px 16px rgba(255,255,255,.09);
  filter: brightness(var(--idleB, 1.02));
  transition: 140ms;
  z-index:3;
}
.bulb .glass:before{
  content:"";
  position:absolute;
  left:36%;
  top:18%;
  width:18%;
  height:54%;
  border-radius:999px;
  background: rgba(255,255,255,0.22);
  transform: rotate(-12deg);
  filter: blur(0.25px);
}

.bulb[data-color="red"]    .glass{ background-color: rgba(255, 70, 70, 0.22); }
.bulb[data-color="green"]  .glass{ background-color: rgba( 70,255,160, 0.20); }
.bulb[data-color="blue"]   .glass{ background-color: rgba( 90,185,255, 0.20); }
.bulb[data-color="yellow"] .glass{ background-color: rgba(255,230, 95, 0.22); }

/* ON state */
.bulb.on .glow{
  opacity: .78;
  filter: blur(19px);
  transition:none;
}
.bulb.on .glass{
  animation: bulbOnFlicker var(--onFlickDur, 2.6s) infinite;
  animation-delay: var(--onFlickDelay, 0s);
  filter: brightness(1.20);
  border-color: rgba(255,255,255,0.24);
  box-shadow:
    0 0 14px var(--glow),
    0 0 44px var(--glow),
    0 0 110px rgba(255,255,255,0.14),
    inset 0 -18px 22px rgba(0,0,0,.28),
    inset 0 12px 16px rgba(255,255,255,.12);
}
@keyframes bulbOnFlicker{
  0%{filter:brightness(1.08)}
  4%{filter:brightness(1.26)}
  7%{filter:brightness(1.02)}
  12%{filter:brightness(1.28)}
  18%{filter:brightness(1.08)}
  45%{filter:brightness(1.26)}
  50%{filter:brightness(1.00)}
  68%{filter:brightness(1.22)}
  82%{filter:brightness(1.08)}
  100%{filter:brightness(1.08)}
}

.bulb.on[data-color="red"]    .glass{ background-color: rgba(255, 78, 78, 0.98); }
.bulb.on[data-color="green"]  .glass{ background-color: rgba( 78,255,165, 0.94); }
.bulb.on[data-color="blue"]   .glass{ background-color: rgba(100,195,255, 0.94); }
.bulb.on[data-color="yellow"] .glass{ background-color: rgba(255,236,110, 0.96); }

/* Controls */
.controls{ display:flex; gap:10px; margin-top:10px; }
.controls input{ flex:1; }
.controls button{ width:190px; }
@media (max-width:520px){
  .controls{ flex-direction:column; }
  .controls button{ width:100%; }
}

input{
  width:100%;
  padding:14px;
  background:#0f0f0f;
  border:1px solid rgba(255,255,255,0.18);
  border-radius:12px;
  color:white;
  font-size:18px;
}

button{
  padding:14px;
  border:none;
  border-radius:12px;
  background:var(--red);
  color:white;
  font-weight:800;
  cursor:pointer;
}
button:disabled{ opacity:.5; cursor:not-allowed; }

.status{ font-size:13px; margin:10px 0 0; color:var(--muted); }

.history{
  margin-top:14px;
  font-size:13px;
  max-height:160px;
  overflow:auto;
  background:rgba(0,0,0,.40);
  border-radius:12px;
  padding:10px;
  border:1px solid rgba(255,255,255,0.07);
}
.msg{
  padding:4px 0;
  border-bottom:1px solid rgba(255,255,255,0.08);
  font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
}
</style>
</head>

<body>

<div class="poster-bg" aria-hidden="true">
  <div class="top"></div>
  <div class="bottom"></div>
  <div class="rift"></div>
</div>
<div class="poster-grain" aria-hidden="true"></div>

<canvas id="particles"></canvas>

<div class="intro" aria-hidden="true">
  <div class="intro-title">BENNOS WALL</div>
</div>

<div class="card">
  <div class="title-plate">
    <h1>Bennos Wall</h1>
    <div class="subtitle">Send a message to the lights</div>
  </div>

  <div class="strand-wrap">
    <div class="cable top" aria-hidden="true">
      <svg viewBox="0 0 1000 120" preserveAspectRatio="none">
        <path class="shadow" d="M0,40 C120,95 240,10 360,58 C480,105 620,20 740,64 C860,98 940,30 1000,62"></path>
        <path d="M0,40 C120,95 240,10 360,58 C480,105 620,20 740,64 C860,98 940,30 1000,62"></path>
      </svg>
    </div>

    <div class="bridge" aria-hidden="true"></div>

    <div class="cable bottom" aria-hidden="true">
      <svg viewBox="0 0 1000 120" preserveAspectRatio="none">
        <path class="shadow" d="M0,52 C140,110 260,18 380,70 C520,122 650,28 770,74 C900,112 960,40 1000,74"></path>
        <path d="M0,52 C140,110 260,18 380,70 C520,122 650,28 770,74 C900,112 960,40 1000,74"></path>
      </svg>
    </div>

    <div class="strand" id="strand"></div>
  </div>

  <div class="controls">
    <input id="msg" placeholder="HELLO WORLD" maxlength="26" />
    <button id="send">Send Message</button>
  </div>

  <div id="status" class="status">Bereit…</div>
  <div id="history" class="history"></div>
</div>

<script>
/* ---------------- CONFIG ---------------- */
const WEBHOOK_URL = "https://eoipntgq6ax4882.m.pipedream.net/";
const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const MAX_LEN = 26;
const colorCycle = ["red","green","blue","yellow"];
const COOLDOWN_SECONDS = 5;
/* ---------------------------------------- */

const strand = document.getElementById("strand");
const msg = document.getElementById("msg");
const btn = document.getElementById("send");
const status = document.getElementById("status");
const historyBox = document.getElementById("history");

const bulbs = {};
const history = [];

/* ✅ animation lock so idle flicker doesn't fight with message display */
let isAnimating = false;

/* Build bulbs with sag */
letters.forEach((l, i) => {
  const b = document.createElement("div");
  b.className = "bulb";
  b.dataset.color = colorCycle[i % colorCycle.length];

  const row = Math.floor(i / 13);
  const colIdx = i % 13;
  const t = colIdx / 12;
  const sag = Math.sin(t * Math.PI) * 12;
  const baseOffset = row === 0 ? 0 : 10;
  const jitter = ((i * 17) % 5) - 2;
  b.style.setProperty("--drop", `${sag + baseOffset + jitter}px`);

  const onFlickDur = 2.0 + ((i * 9) % 18) / 10;
  const onFlickDelay = -((i * 19) % 25) / 10;
  b.style.setProperty("--onFlickDur", `${onFlickDur}s`);
  b.style.setProperty("--onFlickDelay", `${onFlickDelay}s`);

  const glow = document.createElement("div");
  glow.className = "glow";

  const socket = document.createElement("div");
  socket.className = "socket";

  const glass = document.createElement("div");
  glass.className = "glass";

  b.appendChild(glow);
  b.appendChild(socket);
  b.appendChild(glass);

  strand.appendChild(b);
  bulbs[l] = b;
});

const sleep = (ms) => new Promise(r => setTimeout(r, ms));

function clean(t){
  return (t||"")
    .toUpperCase()
    .replace(/Ä/g,"A").replace(/Ö/g,"O").replace(/Ü/g,"U").replace(/ß/g,"SS")
    .replace(/[^A-Z ]/g,"")
    .trimStart()
    .slice(0, MAX_LEN);
}

function setIdleBase(b, idx){
  const baseB = 1.03 + (idx % 7) * 0.004;
  const baseG = 0.14 + (idx % 5) * 0.008;
  b.style.setProperty("--idleB", baseB.toFixed(3));
  b.style.setProperty("--idleG", baseG.toFixed(3));
}

function resetAllIdleBases(){
  const arr = Object.values(bulbs);
  arr.forEach((b, idx) => setIdleBase(b, idx));
}

function allOff(){
  Object.values(bulbs).forEach(b => b.classList.remove("on"));
}
function allOn(){
  Object.values(bulbs).forEach(b => b.classList.add("on"));
}
function on(l){ bulbs[l]?.classList.add("on"); }
function off(l){ bulbs[l]?.classList.remove("on"); }

/* ✅ hard reset: clears "on" and restores idle glow baseline */
function hardReset(){
  allOff();
  resetAllIdleBases();
}

async function animateMessage(text){
  isAnimating = true;

  // pause idle flicker look: set all idle glows super low while animating
  Object.values(bulbs).forEach(b => {
    b.style.setProperty("--idleG", "0.02");
    b.style.setProperty("--idleB", "1.01");
  });

  allOff();
  for(let i=0;i<2;i++){
    allOn(); await sleep(200);
    allOff(); await sleep(200);
  }

  for(const c of text){
    if(c === " "){ await sleep(750); continue; }
    on(c); await sleep(520);
    off(c); await sleep(220);
  }

  await sleep(250);
  for(let i=0;i<4;i++){
    allOn(); await sleep(100);
    allOff(); await sleep(100);
  }

  // restore idle
  hardReset();
  isAnimating = false;
}

function addHistory(t){
  const ts = new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
  history.unshift(`${ts}  ${t}`);
  if(history.length > 10) history.pop();
  historyBox.innerHTML = history.map(x => `<div class="msg">• ${x}</div>`).join("");
}

msg.addEventListener("input", () => {
  msg.value = clean(msg.value);
  status.textContent = `${msg.value.length}/${MAX_LEN} Zeichen (nur A–Z & Leerzeichen)`;
});

/* Idle flicker with concurrency limit (disabled while animating) */
function startIdleFlickerLimited(){
  const bulbEls = Object.values(bulbs);

  bulbEls.forEach((b, idx) => setIdleBase(b, idx));

  const MAX_ACTIVE = 4;
  const active = new Map();
  let lastPick = performance.now();

  function bump(b){
    const now = performance.now();
    const dur = 140 + Math.random()*360;
    const end = now + dur;

    const spikeB = 1.10 + Math.random()*0.22;
    const spikeG = 0.30 + Math.random()*0.34;

    active.set(b, end);
    b.style.setProperty("--idleB", spikeB.toFixed(3));
    b.style.setProperty("--idleG", spikeG.toFixed(3));
  }

  function relax(b){
    const idx = bulbEls.indexOf(b);
    setIdleBase(b, idx);
  }

  function step(){
    const now = performance.now();

    // while message animation: don't run idle flicker
    if(isAnimating){
      requestAnimationFrame(step);
      return;
    }

    for(const [b,end] of active){
      if(b.classList.contains("on")) { active.delete(b); continue; }
      if(now >= end){
        active.delete(b);
        relax(b);
      }
    }

    if(now - lastPick > (120 + Math.random()*240)){
      lastPick = now;

      if(active.size < MAX_ACTIVE){
        let tries = 0;
        while(tries++ < 20){
          const b = bulbEls[(Math.random()*bulbEls.length) | 0];
          if(b.classList.contains("on")) continue;
          if(active.has(b)) continue;
          bump(b);
          break;
        }
      }
    }

    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
startIdleFlickerLimited();

/* Cooldown */
let cooldownTimer = null;
function startCooldown(){
  let left = COOLDOWN_SECONDS;

  btn.disabled = true;
  btn.textContent = `Wait ${left}s`;

  if(cooldownTimer) clearInterval(cooldownTimer);
  cooldownTimer = setInterval(()=>{
    left--;
    if(left <= 0){
      clearInterval(cooldownTimer);
      btn.disabled = false;
      btn.textContent = "Send Message";
      status.textContent = "Bereit…";
      return;
    }
    btn.textContent = `Wait ${left}s`;
  },1000);
}

async function send(){
  const text = clean(msg.value);
  if(!text){
    status.textContent = "Bitte Text eingeben.";
    return;
  }
  if(btn.disabled) return;

  btn.disabled = true;
  status.textContent = "Sende…";

  // show lights locally
  animateMessage(text).catch(()=>{});

  try{
    const r = await fetch(WEBHOOK_URL,{
      method:"POST",
      headers:{"content-type":"application/json"},
      body: JSON.stringify({ text })
    });

    if(r.ok){
      status.textContent = "OK ✅";
      addHistory(text);
      msg.value = "";
      msg.focus();
    } else if(r.status === 429) {
      status.textContent = "Zu viele Nachrichten (429) ⛔";
    } else {
      status.textContent = `Fehler ❌ (${r.status})`;
    }
  } catch(e){
    status.textContent = "Netzwerkfehler ❌";
  } finally {
    startCooldown();
  }
}

btn.addEventListener("click", send);
msg.addEventListener("keydown", e => { if(e.key === "Enter") send(); });

/* Ash particles */
(function(){
  const c = document.getElementById("particles");
  const ctx = c.getContext("2d", { alpha: true });
  const DPR = Math.min(2, window.devicePixelRatio || 1);
  let W=0, H=0;
  let parts = [];
  let last = performance.now();
  const rand = (a,b) => a + Math.random()*(b-a);

  function makeShape(){
    const n = Math.floor(rand(4, 9));
    const pts = [];
    for(let i=0;i<n;i++){
      const ang = rand(0, Math.PI*2);
      const rr = rand(0.0, 1.0) * rand(2.0, 7.0);
      pts.push({ x: Math.cos(ang)*rr, y: Math.sin(ang)*rr*0.8, s: rand(0.7, 2.0) });
    }
    return pts;
  }

  function spawn(){
    const z = Math.random();
    const size = rand(0.9, 1.6) + z*0.9;
    const vy = rand(0.14, 0.40) + z*0.55;
    const vx = rand(-0.20, 0.20);
    const a  = rand(0.16, 0.32) + z*0.10;
    const blur = rand(0.4, 1.4) + z*1.2;

    const cx = Math.random()*W;
    const cy = Math.random()*H;
    const spread = rand(40, 140);

    return {
      x: cx + rand(-spread, spread),
      y: cy + rand(-spread*0.5, spread*0.5),
      vx, vy,
      drift: rand(0.25, 1.0),
      ph: rand(0, Math.PI*2),
      rot: rand(0, Math.PI*2),
      vr: rand(-0.01, 0.01),
      a, blur, size,
      shape: makeShape()
    };
  }

  function resize(){
    W = Math.floor(window.innerWidth);
    H = Math.floor(window.innerHeight);
    c.width  = Math.floor(W * DPR);
    c.height = Math.floor(H * DPR);
    c.style.width = W + "px";
    c.style.height = H + "px";
    ctx.setTransform(DPR,0,0,DPR,0,0);

    const target = Math.max(160, Math.min(420, Math.floor((W*H)/6200)));
    parts = Array.from({length: target}, () => spawn());
  }

  function drawAsh(p, alphaTw){
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = p.a * alphaTw;
    ctx.fillStyle = "rgb(225, 232, 245)";
    ctx.shadowColor = "rgba(230,235,245,0.95)";
    ctx.shadowBlur = p.blur;

    for(const q of p.shape){
      const r = q.s * p.size;
      ctx.beginPath();
      ctx.arc(q.x * p.size, q.y * p.size, r, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }

  function loop(now){
    const dt = Math.min(32, now-last);
    last = now;

    ctx.clearRect(0,0,W,H);

    for(let i=0;i<parts.length;i++){
      const p = parts[i];
      p.x += p.vx * (dt/16);
      p.y += p.vy * (dt/16);
      p.x += Math.sin((now/1000)*p.drift + p.ph) * 0.45;
      p.y += Math.cos((now/1300)*p.drift + p.ph) * 0.10;
      p.rot += p.vr * (dt/16);

      if(p.y > H + 120) parts[i] = spawn();
      if(p.x < -140) p.x = W + 140;
      if(p.x > W + 140) p.x = -140;

      const tw = 0.76 + 0.24*Math.sin((now/1000)*p.drift + p.ph);
      drawAsh(p, tw);
    }
    requestAnimationFrame(loop);
  }

  window.addEventListener("resize", resize, { passive: true });
  resize();
  requestAnimationFrame(loop);
})();
</script>
