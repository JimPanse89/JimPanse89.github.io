<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">

<title>Joyce Wall Messenger</title>

<style>
:root{
  --red:#ff1b2d;
  --warm:#ffe9a6;
  --bg:#0b0b12;
}

body{
  margin:0;
  font-family:system-ui;
  background:
    radial-gradient(circle at 20% 0%, rgba(255,27,45,.25), transparent 60%),
    #0b0b12;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  color:white;
  padding:20px;
}

/* ---------- CARD ---------- */

.card{
  width:min(880px,100%);
  background:rgba(255,255,255,.06);
  padding:28px;
  border-radius:18px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}

/* ---------- TITLE ---------- */

h1{
  font-family:'Creepster';
  text-align:center;
  font-size:60px;
  margin:0 0 20px;
  color:var(--red);
  text-shadow:
    0 0 10px rgba(255,27,45,.9),
    0 0 35px rgba(255,27,45,.6),
    0 0 70px rgba(255,27,45,.4);
}

/* ---------- STRAND ---------- */

.strand-wrap{
  position:relative;
  padding-top:24px;
  margin-bottom:20px;
}

/* Kabel */
.strand-wrap::before{
  content:"";
  position:absolute;
  top:14px;
  left:0;
  right:0;
  height:4px;
  background:#222;
  border-radius:4px;
}

.strand{
  display:grid;
  grid-template-columns:repeat(13,1fr);
  gap:10px;
}

/* echte Birne */
.bulb{
  position:relative;
  width:100%;
  height:48px;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

/* Sockel */
.bulb::before{
  content:"";
  width:10px;
  height:10px;
  background:#444;
  border-radius:2px;
  margin-top:-6px;
  z-index:2;
}

/* Glas */
.bulb::after{
  content:"";
  position:absolute;
  top:8px;
  width:22px;
  height:30px;
  background:#2a2a2a;
  border-radius:50% 50% 45% 45%;
  box-shadow: inset 0 -6px 10px rgba(0,0,0,.6);
  transition:.2s;
}

/* warmes Leuchten */
.bulb.on::after{
  background:var(--warm);
  box-shadow:
    0 0 12px var(--warm),
    0 0 30px var(--warm),
    0 0 60px rgba(255,230,150,.6);
}

/* leichte Unordnung wie echte Kette */
.bulb:nth-child(odd){ transform:translateY(2px) }
.bulb:nth-child(3n){ transform:translateY(4px) }

/* ---------- INPUTS ---------- */

input{
  width:100%;
  padding:14px;
  background:#111;
  border:1px solid #333;
  border-radius:12px;
  color:white;
  font-size:18px;
  margin-bottom:10px;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:var(--red);
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.status{
  font-size:13px;
  margin:10px 0;
  opacity:.8;
}

.history{
  margin-top:14px;
  font-size:13px;
  max-height:120px;
  overflow:auto;
  background:#111;
  border-radius:10px;
  padding:10px;
}

.msg{padding:2px 0}

/* ---------- INTRO ---------- */

.intro{
  position:fixed;
  inset:0;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:999;
  transition:opacity .7s;
}

.intro.hidden{opacity:0;pointer-events:none}

.intro-title{
  font-family:'Creepster';
  font-size:90px;
  color:var(--red);
  text-shadow:0 0 30px var(--red);
}
</style>
</head>

<body>

<div id="intro" class="intro">
  <div class="intro-title">JOYCE WALL</div>
</div>

<div class="card">

<h1>Joyce Wall</h1>

<div class="strand-wrap">
  <div class="strand" id="strand"></div>
</div>

<input id="msg" placeholder="HELLO WORLD" maxlength="26"/>
<button id="send">Send Message</button>
<div id="status" class="status"></div>
<div id="history" class="history"></div>

</div>

<script>
const WEBHOOK_URL="https://eoipntgq6ax4882.m.pipedream.net/";
const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const strand=document.getElementById("strand");
const msg=document.getElementById("msg");
const historyBox=document.getElementById("history");
const status=document.getElementById("status");

const bulbs={},history=[];

window.onload=()=>setTimeout(()=>intro.classList.add("hidden"),1800);

/* build bulbs */
letters.forEach(l=>{
  const d=document.createElement("div");
  d.className="bulb";
  strand.appendChild(d);
  bulbs[l]=d;
});

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clean=t=>t.toUpperCase().replace(/[^A-Z ]/g,"").slice(0,26);

function off(){Object.values(bulbs).forEach(b=>b.classList.remove("on"))}
function on(l){bulbs[l]?.classList.add("on")}

async function animate(text){
  off();
  for(let i=0;i<2;i++){
    Object.values(bulbs).forEach(b=>b.classList.add("on"));
    await sleep(200);
    off();
    await sleep(200);
  }

  for(const c of text){
    if(c===" "){await sleep(750);continue;}
    on(c);
    await sleep(500);
    off();
    await sleep(250);
  }
}

function addHistory(t){
  history.unshift(t);
  historyBox.innerHTML=history.slice(0,10).map(x=>`<div class="msg">• ${x}</div>`).join("");
}

msg.oninput=()=>status.textContent=`${msg.value.length}/26 Zeichen`;

async function send(){
  const text=clean(msg.value);
  if(!text)return;

  animate(text);
  await fetch(WEBHOOK_URL,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({text})});
  addHistory(text);
  msg.value="";
}

send.onclick=send;
msg.addEventListener("keydown",e=>e.key==="Enter"&&send());
</script>

</body>
</html>
